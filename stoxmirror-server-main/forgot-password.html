<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — pruxdemarkets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    :root{--bg:#0a0a0a;--panel-a:#24262d;--panel-b:#0e0f12;--card-border:rgba(64,74,94,.5);--text:#e2e2e2;--muted:#b5b5b5;--heading:#fff;--accent1:#3760ff;--accent2:#35a6ec;--field:#101216;--field-border:rgba(255,255,255,.1);--danger:#ff5470;--ok:#2fd27a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(1200px 500px at 50% -10%, rgba(55,96,255,.12), transparent 60%)}
    .auth-card{width:100%;max-width:440px;background:linear-gradient(137.45deg,var(--panel-a) 7%,var(--panel-b) 104%);border:1px solid var(--card-border);border-radius:20px;padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    .brand-logo{display:block;width:210px;max-width:100%;height:auto;margin:-14px 0}
    h1{color:var(--heading);font-size:1.5rem;font-weight:800;margin-bottom:6px}
    .sub{color:var(--muted);font-size:.93rem;margin-bottom:22px}
    label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 7px}
    .field{width:100%;background:var(--field);border:1px solid var(--field-border);color:var(--text);border-radius:10px;padding:13px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
    .field:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(53,166,236,.15)}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.78rem}
    .otp-row{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
    .otp{width:46px;height:56px;text-align:center;font-size:1.4rem;background:var(--field);border:1px solid var(--field-border);border-radius:10px;color:var(--heading);outline:none}
    .otp:focus{border-color:var(--accent2)}
    .btn{width:100%;margin-top:22px;border:none;border-radius:10px;padding:14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(135deg,var(--accent1),var(--accent2))}
    .btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:not-allowed}
    .alt{text-align:center;margin-top:20px;color:var(--muted);font-size:.9rem}
    .alt a{color:var(--accent2);text-decoration:none;font-weight:600}
    .msg{margin-top:14px;font-size:.88rem;border-radius:10px;padding:11px 13px;display:none}
    .msg.err{display:block;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.3);color:var(--danger)}
    .msg.ok{display:block;background:rgba(47,210,122,.1);border:1px solid rgba(47,210,122,.3);color:var(--ok)}
    .step{display:none}.step.active{display:block}
    .otp-note{text-align:center;color:var(--muted);font-size:.86rem}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand"><img class="brand-logo" src="https://www.pruxdemarkets.com/logo.png" alt="pruxdemarkets"></div>
    <h1 id="title">Reset your password</h1>
    <p class="sub" id="sub">Enter your email and we'll send you a reset code.</p>

    <!-- STEP 1: email -->
    <section class="step active" data-step="1">
      <label for="email">Email address</label>
      <input class="field" type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </section>

    <!-- STEP 2: OTP -->
    <section class="step" data-step="2">
      <p class="otp-note">Enter the 6-digit code sent to <b id="emailEcho"></b>.</p>
      <div class="otp-row">
        <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
        <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
      </div>
    </section>

    <!-- STEP 3: new password -->
    <section class="step" data-step="3">
      <label for="password">New password</label>
      <div class="pw-wrap"><input class="field" type="password" id="password" placeholder="At least 6 characters"><button type="button" class="pw-toggle" data-for="password">Show</button></div>
      <label for="confirm">Confirm new password</label>
      <div class="pw-wrap"><input class="field" type="password" id="confirm" placeholder="Re-enter your new password"><button type="button" class="pw-toggle" data-for="confirm">Show</button></div>
    </section>

    <div class="msg" id="msg"></div>
    <button class="btn" id="nextBtn">Send reset code</button>
    <p class="alt">Remembered it? <a href="/login">Back to sign in</a></p>
  </div>

  <script>
    const API = "https://pm-render-853f.onrender.com";
    let step = 1, resetEmail = '', resetCode = '';
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    const showMsg = (t, ok) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = t; msg.style.display = 'block'; };
    const clearMsg = () => { msg.style.display = 'none'; msg.className = 'msg'; };

    const titles = { 1:['Reset your password', "Enter your email and we'll send you a reset code."],
                     2:['Enter your code', 'Check your email for the 6-digit reset code.'],
                     3:['Set a new password', 'Choose a strong new password for your account.'] };
    const btnText = { 1:'Send reset code', 2:'Verify code', 3:'Reset password' };

    function render(){
      document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', +s.dataset.step === step));
      $('title').textContent = titles[step][0]; $('sub').textContent = titles[step][1];
      $('nextBtn').textContent = btnText[step]; $('nextBtn').disabled = false; clearMsg();
    }

    // OTP inputs
    const otps = Array.from(document.querySelectorAll('.otp'));
    otps.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g,''); if(inp.value && i < otps.length-1) otps[i+1].focus(); });
      inp.addEventListener('keydown', e => { if(e.key === 'Backspace' && !inp.value && i > 0) otps[i-1].focus(); });
    });
    document.querySelectorAll('.pw-toggle').forEach(b => b.addEventListener('click', function(){
      const f = $(this.dataset.for); const show = f.type === 'password'; f.type = show ? 'text' : 'password'; this.textContent = show ? 'Hide' : 'Show';
    }));

    async function sendCode(){
      const email = $('email').value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showMsg('Please enter a valid email address.'); return; }
      const btn = $('nextBtn'); btn.disabled = true; btn.textContent = 'Sending…';
      try{
        await jQuery.ajax({ type:'PUT', url:API + '/auth/forgot-password', contentType:'application/json', data: JSON.stringify({ email }), dataType:'json', timeout:60000 });
        resetEmail = email;
        $('emailEcho').textContent = email; step = 2; render();
      }catch(err){
        const m = err.status === 404 ? 'No account found with that email.'
          : (err.responseJSON && err.responseJSON.message) || (err.statusText === 'timeout' ? 'The server took too long — please try again.' : 'Something went wrong. Please try again.');
        showMsg(m); btn.disabled = false; btn.textContent = 'Send reset code';
      }
    }

    async function verifyCode(){
      const entered = otps.map(i => i.value).join('');
      if(entered.length < 6){ showMsg('Enter the 6-digit code.'); return; }
      const btn = $('nextBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
      try{
        await jQuery.ajax({ type:'PUT', url:API + '/auth/forgot-password/check-code', contentType:'application/json', data: JSON.stringify({ email: resetEmail, otp: entered }), dataType:'json', timeout:60000 });
        resetCode = entered; step = 3; render();
      }catch(err){
        showMsg((err.responseJSON && err.responseJSON.message) || 'Could not verify the code. Please try again.');
        btn.disabled = false; btn.textContent = 'Verify code';
      }
    }

    async function resetPassword(){
      const p = $('password').value, c = $('confirm').value;
      if(p.length < 6){ showMsg('Password must be at least 6 characters.'); return; }
      if(p !== c){ showMsg("Passwords don't match."); return; }
      const btn = $('nextBtn'); btn.disabled = true; btn.textContent = 'Resetting…';
      try{
        await jQuery.ajax({ type:'PUT', url:API + '/auth/forgot-password/reset', contentType:'application/json', data: JSON.stringify({ email: resetEmail, otp: resetCode, password: p }), dataType:'json', timeout:60000 });
        showMsg('Password updated! Redirecting to sign in…', true);
        setTimeout(() => { window.location.href = '/login.html'; }, 900);
      }catch(err){
        const m = (err.responseJSON && err.responseJSON.message) || 'Could not reset the password. Please try again.';
        showMsg(m); btn.disabled = false; btn.textContent = 'Reset password';
      }
    }

    $('nextBtn').addEventListener('click', () => {
      if(step === 1) sendCode();
      else if(step === 2) verifyCode();
      else resetPassword();
    });

    render();
  </script>
</body>
</html>
