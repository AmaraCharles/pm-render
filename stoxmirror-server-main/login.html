<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Sign In — Logic Pro Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    :root{
      --bg:#0a0a0a; --panel-a:#24262d; --panel-b:#0e0f12;
      --card-border:rgba(64,74,94,.5);
      --text:#e2e2e2; --muted:#b5b5b5; --heading:#fff;
      --accent1:#3760ff; --accent2:#35a6ec;
      --field:#101216; --field-border:rgba(255,255,255,.1);
      --danger:#ff5470;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background-image:radial-gradient(1200px 500px at 50% -10%, rgba(55,96,255,.12), transparent 60%);
    }
    .auth-card{
      width:100%;max-width:420px;background:linear-gradient(137.45deg,var(--panel-a) 7%,var(--panel-b) 104%);
      border:1px solid var(--card-border);border-radius:20px;padding:36px 32px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .brand-mark{
      width:34px;height:34px;border-radius:9px;flex-shrink:0;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
    }
    .brand-name{font-weight:700;letter-spacing:.3px;color:var(--heading);font-size:1.05rem}
    .brand-name span{background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    h1{color:var(--heading);font-size:1.6rem;font-weight:800;margin-bottom:6px}
    .sub{color:var(--muted);font-size:.95rem;margin-bottom:26px}
    label{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 7px}
    .field{
      width:100%;background:var(--field);border:1px solid var(--field-border);color:var(--text);
      border-radius:10px;padding:13px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;
    }
    .field:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(53,166,236,.15)}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem}
    .btn{
      width:100%;margin-top:24px;border:none;border-radius:10px;padding:14px;cursor:pointer;
      font-family:inherit;font-weight:700;font-size:1rem;color:#fff;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));transition:filter .15s,transform .05s;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .alt{text-align:center;margin-top:22px;color:var(--muted);font-size:.9rem}
    .alt a{color:var(--accent2);text-decoration:none;font-weight:600}
    .row-between{display:flex;justify-content:flex-end;margin-top:8px}
    .row-between a{color:var(--muted);font-size:.82rem;text-decoration:none}
    .msg{margin-top:16px;font-size:.88rem;border-radius:10px;padding:11px 13px;display:none}
    .msg.err{display:block;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.3);color:var(--danger)}
    .msg.ok{display:block;background:rgba(53,166,236,.1);border:1px solid rgba(53,166,236,.3);color:var(--accent2)}
  </style>
</head>
<body>
  <form class="auth-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <span class="brand-mark">AP</span>
      <span class="brand-name">ACMW<span>Pro</span> Trading</span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account to continue.</p>

    <label for="email">Email address</label>
    <input class="field" type="email" id="email" placeholder="you@example.com" required autocomplete="email">

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input class="field" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pwToggle">Show</button>
    </div>
    <div class="row-between"><a href="/forgot-password">Forgot password?</a></div>

    <div class="msg" id="msg"></div>
    <button class="btn" type="submit" id="submitBtn">Sign In</button>

    <p class="alt">Don't have an account? <a href="/register">Create one</a></p>
  </form>

  <script>
    const API = "https://logicpro-render.onrender.com";
    const $msg = document.getElementById('msg');
    function showMsg(text, ok){ $msg.className = 'msg ' + (ok ? 'ok' : 'err'); $msg.textContent = text; $msg.style.display = 'block'; }

    document.getElementById('pwToggle').addEventListener('click', function(){
      const p = document.getElementById('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      this.textContent = show ? 'Hide' : 'Show';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      if(!email || !password){ showMsg('Please enter your email and password.'); return; }

      btn.disabled = true; btn.textContent = 'Signing in…'; $msg.style.display='none';
      try{
        const res = await $.ajax({
          type:'POST', url:API + '/auth/login',
          contentType:'application/json', data: JSON.stringify({ email, password }),
          dataType:'json', timeout:30000
        });
        if(res && res.code === 'Ok' && res.data){
          localStorage.setItem('userData', JSON.stringify(res.data));
          if(res.token) localStorage.setItem('adminToken', res.token);
          showMsg('Signed in. Redirecting…', true);
          window.location.href = '/dashboard/public/';
        } else {
          showMsg('Unexpected response. Please try again.');
          btn.disabled=false; btn.textContent='Sign In';
        }
      }catch(err){
        const code = err.status;
        let m = 'Login failed. Please try again.';
        if(code === 404) m = 'No account found with that email.';
        else if(code === 401 || code === 400) m = 'Incorrect email or password.';
        else if(err.responseJSON && err.responseJSON.message) m = err.responseJSON.message;
        showMsg(m);
        btn.disabled=false; btn.textContent='Sign In';
      }
    });
  </script>
</body>
</html>
