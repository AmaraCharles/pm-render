<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Logic Pro Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    :root{--bg:#0a0a0a;--panel-a:#24262d;--panel-b:#0e0f12;--card-border:rgba(64,74,94,.5);--text:#e2e2e2;--muted:#b5b5b5;--heading:#fff;--accent1:#3760ff;--accent2:#35a6ec;--field:#101216;--field-border:rgba(255,255,255,.1);--danger:#ff5470;--ok:#2fd27a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(1200px 500px at 50% -10%, rgba(55,96,255,.12), transparent 60%)}
    .auth-card{width:100%;max-width:440px;background:linear-gradient(137.45deg,var(--panel-a) 7%,var(--panel-b) 104%);border:1px solid var(--card-border);border-radius:20px;padding:36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
    .brand-name{font-weight:700;color:var(--heading)}
    .brand-name span{background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    h1{color:var(--heading);font-size:1.5rem;font-weight:800;margin-bottom:8px}
    .sub{color:var(--muted);font-size:.93rem;margin-bottom:8px}
    .sub b{color:var(--text)}
    .otp-row{display:flex;gap:10px;justify-content:center;margin:24px 0 10px}
    .otp{width:48px;height:58px;text-align:center;font-size:1.5rem;background:var(--field);border:1px solid var(--field-border);border-radius:10px;color:var(--heading);outline:none}
    .otp:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(53,166,236,.15)}
    .btn{width:100%;margin-top:18px;border:none;border-radius:10px;padding:14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(135deg,var(--accent1),var(--accent2))}
    .btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:not-allowed}
    .resend{margin-top:18px;color:var(--muted);font-size:.88rem}
    .resend a{color:var(--accent2);text-decoration:none;font-weight:600;cursor:pointer}
    .msg{margin-top:14px;font-size:.88rem;border-radius:10px;padding:11px 13px;display:none}
    .msg.err{display:block;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.3);color:var(--danger)}
    .msg.ok{display:block;background:rgba(47,210,122,.1);border:1px solid rgba(47,210,122,.3);color:var(--ok)}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">PM</span><span class="brand-name">PRUXDE<span>Pro</span> Trading</span></div>
    <h1>Verify your email</h1>
    <p class="sub">We sent a 6-digit code to <b id="email">your email</b>.</p>
    <p class="sub">Enter it below to verify your email.</p>

    <div class="otp-row">
      <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
      <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
      <input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
    </div>

    <div class="msg" id="msg"></div>
    <button class="btn" id="verifyBtn">Verify &amp; continue</button>
    <a class="btn" id="signInLink" href="/login.html" style="display:none;text-align:center;text-decoration:none">Go to sign in</a>
    <p class="resend" id="resendWrap">Didn't get the code? <a id="resendLink" style="display:none">Resend</a><span id="resendTimer">Resend in <b id="cd">30</b>s</span></p>
  </div>

  <script>
    const API = "https://logicpro-render.onrender.com";
    const email = localStorage.getItem('reg_email') || '';
    const msg = document.getElementById('msg');
    const showMsg = (t, ok) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = t; msg.style.display = 'block'; };

    if(!email){
      // Arrived here without a pending registration — send them to sign up.
      document.getElementById('email').textContent = '—';
      showMsg('No pending sign-up found. Please register first.');
    } else {
      document.getElementById('email').textContent = email;
    }

    const otps = Array.from(document.querySelectorAll('.otp'));
    otps.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g,''); if(inp.value && i < otps.length-1) otps[i+1].focus(); });
      inp.addEventListener('keydown', e => { if(e.key === 'Backspace' && !inp.value && i > 0) otps[i-1].focus(); });
      inp.addEventListener('paste', e => {
        const d = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,6);
        if(d){ e.preventDefault(); d.split('').forEach((c,j)=>{ if(otps[j]) otps[j].value=c; }); (otps[Math.min(d.length,5)]).focus(); }
      });
    });
    otps[0].focus();

    document.getElementById('verifyBtn').addEventListener('click', async function(){
      const entered = otps.map(i => i.value).join('');
      const stored = localStorage.getItem('reg_otp');
      if(entered.length < 6){ showMsg('Please enter the 6-digit code.'); return; }
      if(stored && entered !== stored){ showMsg('That code is incorrect. Please try again.'); return; }
      this.disabled = true; this.textContent = 'Verifying…';
      try{ await $.ajax({ type:'PUT', url:API + '/auth/' + encodeURIComponent(email) + '/verify', timeout:30000 }); }
      catch(e){ /* best-effort; the account already exists */ }
      localStorage.removeItem('reg_otp'); localStorage.removeItem('reg_email');
      // Sign-in stays blocked until an admin approves, so don't auto-redirect.
      clearInterval(timer);
      document.querySelector('h1').textContent = 'Email verified';
      document.querySelectorAll('.sub, .otp-row, #resendWrap, #verifyBtn').forEach(el => { el.style.display = 'none'; });
      document.getElementById('signInLink').style.display = 'block';
      showMsg('Your account is awaiting admin approval. Please contact your personal trader for access.', true);
    });

    // Resend countdown (prototype: re-enables the link; wire to a resend endpoint when available)
    let cd = 30; const cdEl = document.getElementById('cd');
    const timer = setInterval(() => {
      cd--; if(cdEl) cdEl.textContent = cd;
      if(cd <= 0){ clearInterval(timer); document.getElementById('resendTimer').style.display='none'; document.getElementById('resendLink').style.display='inline'; }
    }, 1000);
    document.getElementById('resendLink').addEventListener('click', () => {
      showMsg('If you don’t receive a code, please return to sign up and try again.', true);
    });
  </script>
</body>
</html>
